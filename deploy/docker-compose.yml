# Hosting statis untuk coc.balanglompo.com di VPS.
#
# VPS itu menjalankan Coolify, dan Traefik (container `coolify-proxy`) yang
# memegang port 80/443 sekaligus mengurus sertifikat Let's Encrypt. Jadi
# container ini TIDAK boleh membuka port ke host — ia hanya bicara HTTP di
# port 80 lewat jaringan `coolify`, dan Traefik yang meneruskan trafik ke
# sini berdasarkan label di bawah. Polanya sama dengan jadwal-belajar dan
# jurnal-balanglompo yang sudah jalan di server itu.
#
# Direktori induk (hasil git clone) dipasang read-only sebagai akar web, dan
# situsnya tidak punya proses build — jadi mengubah HTML/CSS/JS cukup
# `git pull`, tanpa rebuild dan tanpa restart container. Yang perlu dibangun
# ulang hanya container API, dan itu pun hanya kalau isi server/ berubah.
#
#   pasang : git clone https://github.com/muhfarid2903/coc.git /opt/coc
#            cd /opt/coc/deploy && docker compose up -d
#   update : bash /opt/coc/deploy/update.sh
#
# Rahasia ada di deploy/.env yang hanya hidup di server dan tidak masuk git:
#   SANDI_GURU_SCRYPT=<garam>:<hash>   dibuat oleh server/hash-passphrase.js
# Tanpa berkas itu, situs dan permainannya tetap jalan penuh — hanya dasbor
# guru yang terkunci dan API menolak seluruh jalur /api/guru.
#
# PENTING: nginx.conf dipasang sebagai bind mount berkas tunggal, yang terikat
# inode. `git pull` menulis inode baru, sehingga container tetap membaca versi
# lama dan `nginx -s reload` tidak menolong. Setiap kali nginx.conf berubah:
#   docker compose up -d --force-recreate coc
# (update.sh sudah menangani ini sendiri.)

# Nama project Compose dikunci di sini. Tanpa ini, Compose memakai nama folder
# induk berkas — yaitu "deploy" — persis sama dengan /opt/jadwal-belajar/deploy
# di server yang sama, sehingga kedua situs terlihat sebagai satu project dan
# `docker compose --remove-orphans` dari salah satunya bisa menghapus container
# milik yang lain.
name: coc

services:
  coc:
    image: nginx:alpine
    container_name: coc
    restart: unless-stopped
    volumes:
      - ../:/srv/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify
      # HTTP hanya untuk tantangan ACME dan pengalihan ke HTTPS.
      traefik.http.routers.coc-http.entrypoints: http
      traefik.http.routers.coc-http.rule: Host(`coc.balanglompo.com`)
      traefik.http.routers.coc-http.middlewares: coc-redirect
      traefik.http.middlewares.coc-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.coc-redirect.redirectscheme.permanent: 'true'
      traefik.http.routers.coc.entrypoints: https
      traefik.http.routers.coc.rule: Host(`coc.balanglompo.com`)
      traefik.http.routers.coc.tls: 'true'
      traefik.http.routers.coc.tls.certresolver: letsencrypt
      # priority rendah: router API di bawah punya angka lebih tinggi, jadi
      # /api mendarat di sana dan sisanya jatuh ke situs statis ini.
      traefik.http.routers.coc.priority: '1'
      traefik.http.services.coc.loadbalancer.server.port: '80'

  # API kelas: identitas siswa, sinkron progres, papan peringkat sekelas,
  # dan dasbor guru. Satu origin dengan situsnya, hanya dibedakan prefiks
  # /api — sehingga cookie sesi cukup SameSite=Lax dan tidak perlu CORS.
  coc-api:
    build:
      context: ../server
    image: coc-api:latest
    container_name: coc-api
    restart: unless-stopped
    # required:false — tanpa ini, deploy gagal total hanya karena deploy/.env
    # belum dibuat. Padahal berkas itu cuma memegang frasa sandi guru: tanpa
    # dia, situs dan permainannya tetap jalan penuh dan hanya dasbor guru yang
    # terkunci. Kegagalan yang tepat di sini adalah dasbor terkunci, bukan
    # seluruh situs mati.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Makassar
    volumes:
      # SQLite hidup di sini, di luar image dan di luar git. Inilah satu-
      # satunya direktori yang perlu di-backup.
      - ./data:/data
    networks:
      - coolify
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify
      traefik.http.routers.coc-api.entrypoints: https
      traefik.http.routers.coc-api.rule: Host(`coc.balanglompo.com`) && PathPrefix(`/api`)
      traefik.http.routers.coc-api.priority: '10'
      traefik.http.routers.coc-api.tls: 'true'
      traefik.http.routers.coc-api.tls.certresolver: letsencrypt
      traefik.http.services.coc-api.loadbalancer.server.port: '8080'

networks:
  coolify:
    external: true
