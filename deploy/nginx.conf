# ============================================================
# Nginx untuk COC — Clash of Champions Matematika
#
# Pasang di: /etc/nginx/sites-available/coc
# Aktifkan  : ln -s /etc/nginx/sites-available/coc /etc/nginx/sites-enabled/
#
# Ganti "contoh.com" dengan domainmu, lalu jalankan certbot (lihat README).
# Certbot akan menambahkan sendiri blok HTTPS di berkas ini.
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name contoh.com www.contoh.com;

    root /var/www/coc;
    index index.html;

    # ---------- Kompresi ----------
    # Aset situs ini seluruhnya teks, jadi gzip memangkasnya sangat banyak
    # (sekitar 130 KB menjadi 30 KB).
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # ---------- Cache ----------
    # Nama berkas CSS/JS di sini tidak bersidik jari (tidak ada hash), sehingga
    # cache jangka panjang akan menyajikan versi usang setelah deploy.
    # "no-cache" tetap cepat: peramban memvalidasi lewat ETag dan umumnya
    # hanya menerima balasan 304 tanpa isi.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # ---------- Header keamanan ----------
    # CSP ini cocok dengan situs apa adanya: skrip hanya dari domain sendiri,
    # huruf dari Google Fonts, favicon berupa data URI, dan tanpa panggilan
    # jaringan sama sekali. 'unsafe-inline' pada style diperlukan karena
    # antarmuka menulis atribut style secara langsung dari JavaScript.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # ---------- Lain-lain ----------
    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}
