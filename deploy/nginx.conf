# ============================================================
# Nginx di dalam container (lihat docker-compose.yml).
#
# Akar webnya adalah hasil git clone yang dipasang read-only di /srv/site.
# TLS, domain, dan pengalihan HTTP→HTTPS diurus Traefik di depan, jadi di
# sini cukup melayani HTTP polos di port 80.
# ============================================================

server {
    listen 80;
    server_name _;

    root /srv/site;
    index index.html;

    # ---------- Kompresi ----------
    # Aset situs ini seluruhnya teks, jadi gzip memangkasnya sangat banyak
    # (sekitar 130 KB menjadi 30 KB).
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # ---------- Header ----------
    # Semuanya di tingkat server, bukan di dalam location: nginx hanya
    # mewarisi add_header dari tingkat di atas bila tingkat sekarang tidak
    # punya add_header sama sekali. Satu add_header di dalam `location /`
    # akan diam-diam membuang seluruh header keamanan di bawah ini.
    #
    # Nama berkas CSS/JS di sini tidak bersidik jari (tidak ada hash), sehingga
    # cache jangka panjang akan menyajikan versi usang setelah deploy.
    # "no-cache" tetap cepat: peramban memvalidasi lewat ETag dan umumnya
    # hanya menerima balasan 304 tanpa isi.
    add_header Cache-Control "no-cache" always;

    # CSP ini cocok dengan situs apa adanya: skrip hanya dari domain sendiri,
    # huruf dari Google Fonts, dan favicon berupa data URI. 'unsafe-inline'
    # pada style diperlukan karena antarmuka menulis atribut style secara
    # langsung dari JavaScript.
    #
    # connect-src 'self', bukan 'none': sejak ada API kelas, aplikasi
    # memanggil /api pada origin yang sama untuk masuk kelas, menyinkronkan
    # profil, dan memuat papan peringkat. Dengan 'none' seluruh fitur kelas
    # gagal diam-diam — fetch-nya diblokir peramban sebelum sempat dikirim.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # ---------- Isi repo yang bukan bagian dari situs ----------
    # `server/` berisi kode API dan tidak boleh disajikan sebagai berkas
    # statis. /api sendiri tidak pernah sampai ke sini: Traefik mengarahkannya
    # ke container API lebih dulu lewat router ber-priority lebih tinggi.
    location ~ ^/(deploy/|server/|README\.md) { return 404; }
    location ~ /\.               { return 404; }

    # Sengaja TIDAK jatuh ke /index.html: app ini satu halaman tanpa routing
    # sisi client, jadi fallback semacam itu hanya membuat berkas yang tidak
    # ada membalas 200 berisi HTML — aset yang hilang atau salah nama jadi
    # tersamar.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
