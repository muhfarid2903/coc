<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>COC — Clash of Champions Matematika</title>
<meta name="description" content="Arena turnamen matematika: duel cepat, bracket 8 besar, papan peringkat, dan misi harian."/>
<meta name="theme-color" content="#0b1116"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b1116'/><rect x='2.5' y='2.5' width='27' height='27' rx='4' fill='none' stroke='%236d7c85' stroke-width='2'/><text x='16' y='23' text-anchor='middle' font-size='16'>⚔️</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Anton&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- Panggung: latar arena batu yang terlihat di balik bingkai. -->
<div class="stage" aria-hidden="true">
  <span class="stage-arch l"></span>
  <span class="stage-arch r"></span>
  <span class="stage-glow"></span>
  <span class="stage-grain"></span>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- Bingkai batu pahat: tepi + blok sudut + slab tengah atas/bawah. -->
<div class="frame" aria-hidden="true">
  <span class="cnr tl"></span><span class="cnr tr"></span>
  <span class="cnr bl"></span><span class="cnr br"></span>
  <span class="slab t"></span><span class="slab b"></span>
</div>

<div id="app" class="app">

  <header id="topbar" class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="Beranda">
      <span class="brand-mark">⚔</span>
      <span class="brand-text"><b>COC</b><small>Clash of Champions</small></span>
    </button>
    <div class="wallet">
      <span class="chip chip-coin" title="Koin"><i>🪙</i><b id="hudCoin">0</b></span>
      <span class="chip chip-gem" title="Permata"><i>💎</i><b id="hudGem">0</b></span>
    </div>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav id="tabbar" class="tabbar" aria-label="Navigasi utama">
    <button class="tab" data-tab="home"  type="button"><i>🏟️</i><span>Arena</span></button>
    <button class="tab" data-tab="rank"  type="button"><i>📊</i><span>Peringkat</span></button>
    <button class="tab" data-tab="quest" type="button"><i>🎯</i><span>Misi</span></button>
    <button class="tab" data-tab="me"    type="button"><i>🧑‍🚀</i><span>Profil</span></button>
  </nav>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<!-- Arena ini dirancang mendatar. Di HP yang dipegang tegak, ajakan
     memutar layar muncul — tapi tetap bisa dilewati, karena ada siswa
     yang kunci rotasinya menyala dan tidak boleh sampai terkurung. -->
<div id="rotate" class="rotate">
  <div class="rotate-in">
    <span class="rotate-ic" aria-hidden="true"></span>
    <b>Putar Perangkatmu</b>
    <p>Arena bertanding dirancang untuk layar mendatar.</p>
    <button class="btn btn-sm" id="rotateSkip" type="button">Lanjut Saja</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/fx.js"></script>
<script src="js/net.js"></script>
<script src="js/live.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
