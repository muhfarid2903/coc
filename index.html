<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Warkop Jaya — Input Harian</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c8956c'/><text x='16' y='23' text-anchor='middle' fill='%23fff' font-size='18' font-weight='bold'>W</text></svg>"/>
  <meta name="theme-color" content="#0c0a08"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0a08;--surface:#151210;--surface2:#1c1814;--surface3:#252019;--surface4:#302920;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--border3:rgba(255,255,255,.15);
  --text:#f5f0ea;--text2:#a89b8c;--text3:#6b5f52;
  --gold:#c8956c;--gold2:#b07d55;--gold3:#ddb08a;--gold4:#e8c9a8;
  --gold-bg:rgba(200,149,108,.08);--gold-border:rgba(200,149,108,.18);--gold-glow:rgba(200,149,108,.12);
  --red:#e06060;--red-bg:rgba(224,96,96,.08);--red-border:rgba(224,96,96,.12);
  --green:#5cb87a;--green-bg:rgba(92,184,122,.08);--green-border:rgba(92,184,122,.12);
  --blue:#5a9ed6;--blue-bg:rgba(90,158,214,.08);
  --orange:#d4964a;--orange-bg:rgba(212,150,74,.08);--orange-border:rgba(212,150,74,.15);
  --radius:16px;--shadow:0 12px 40px rgba(0,0,0,.5);
}
html,body,#root{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.app::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 600px 400px at 15% 5%,rgba(200,149,108,.07),transparent),
    radial-gradient(ellipse 500px 500px at 85% 95%,rgba(200,149,108,.04),transparent),
    radial-gradient(ellipse 800px 300px at 50% 50%,rgba(200,149,108,.02),transparent);
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(200,149,108,.15)}50%{box-shadow:0 0 30px rgba(200,149,108,.25)}}

/* HEADER */
.header{
  background:rgba(12,10,8,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:100;
}
.header-logo{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;letter-spacing:-1px;flex-shrink:0;
  box-shadow:0 2px 12px rgba(200,149,108,.3);
}
.header-info{flex:1;min-width:0}
.header-title{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.header-sub{font-size:11.5px;color:var(--text3);font-weight:400;margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}

.sync-badge{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.sync-online{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sync-offline{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.sync-dot{width:6px;height:6px;border-radius:50%}
.sync-dot.online{background:var(--green);animation:pulse 2s infinite}
.sync-dot.offline{background:var(--red)}

/* LAYOUT */
.main-area{display:flex;flex:1;position:relative;z-index:1}
.sidebar{
  width:220px;background:var(--surface);border-right:1px solid var(--border);
  padding:20px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;
}
.sidebar-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;padding:16px 14px 8px}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border:none;background:transparent;
  color:var(--text3);font-size:13.5px;font-family:inherit;font-weight:500;
  border-radius:10px;cursor:pointer;transition:all .2s;
}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--text2)}
.nav-btn.active{background:var(--gold-bg);color:var(--gold);font-weight:600;border:1px solid var(--gold-border)}

.content{flex:1;padding:28px;overflow-y:auto;max-height:calc(100vh - 67px)}
.page-header{margin-bottom:28px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.7px;line-height:1.1;color:var(--text)}
.page-sub{color:var(--text3);font-size:13.5px;margin-top:6px;font-weight:400}

/* CARD */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;margin-bottom:14px;
  position:relative;animation:fadeIn .35s ease both;
}
.card::before{content:'';position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 50%)}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card-label{
  font-size:10.5px;font-weight:700;color:var(--gold);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.card-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--gold);color:#0c0a08}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.btn-danger:hover{background:rgba(224,96,96,.16)}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border2)}
.btn-ghost:hover{background:rgba(255,255,255,.04);color:var(--text2);border-color:var(--border3)}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn-save{
  width:100%;padding:16px;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#fff;border:none;border-radius:14px;cursor:pointer;
  box-shadow:0 4px 20px rgba(200,149,108,.3);
  transition:all .25s;letter-spacing:.01em;
  text-shadow:0 1px 2px rgba(0,0,0,.2);
}
.btn-save:hover{box-shadow:0 8px 32px rgba(200,149,108,.4);transform:translateY(-2px)}
.btn-save:active{transform:translateY(0) scale(.99)}
.btn-save:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* PRODUCT ROW */
.product-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:14px}
.product-row:last-child{border-bottom:none}
.product-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border);
}
.product-info{flex:1;min-width:0}
.product-name{font-size:14px;font-weight:600;letter-spacing:-.1px}
.product-meta{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:2px;font-weight:400}
.qty-control{
  display:flex;align-items:center;
  border:1px solid var(--border2);border-radius:12px;overflow:hidden;flex-shrink:0;
  background:var(--surface2);
}
.qty-btn{
  width:40px;height:40px;background:transparent;border:none;
  font-size:18px;color:var(--text3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;user-select:none;font-family:inherit;
}
.qty-btn:hover{background:rgba(255,255,255,.05);color:var(--gold)}
.qty-btn:active{color:var(--gold);transform:scale(.9)}
.qty-display{
  width:46px;height:40px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  color:var(--gold);border:none;background:var(--surface);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  -moz-appearance:textfield;outline:none;
}
.qty-display::-webkit-inner-spin-button{display:none}
.qty-display:focus{background:var(--gold-bg)}

/* EXPENSE */
.expense-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.expense-input{flex:1;padding:10px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:all .2s}
.expense-input:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px var(--gold-bg)}
.expense-input::placeholder{color:var(--text3)}
.expense-amount{width:120px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;outline:none;transition:all .2s;flex-shrink:0}
.expense-amount:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px var(--gold-bg)}
.expense-amount::placeholder{color:var(--text3)}
.del-btn{width:36px;height:36px;background:none;border:1px solid var(--border2);border-radius:10px;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .15s;font-family:inherit}
.del-btn:hover{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.add-expense-btn{font-family:inherit;font-size:13px;font-weight:600;color:var(--gold);background:var(--gold-bg);border:1px dashed var(--gold-border);border-radius:12px;padding:11px 14px;cursor:pointer;width:100%;transition:all .2s}
.add-expense-btn:hover{background:var(--gold-glow);border-color:var(--gold)}

/* DATE */
.date-row{display:flex;align-items:center;gap:10px}
.date-input{font-family:'JetBrains Mono',monospace;font-size:13.5px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:10px 14px;border-radius:10px;flex:1;cursor:pointer;outline:none;transition:all .2s}
.date-input:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px var(--gold-bg)}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-item{background:var(--surface2);border-radius:12px;padding:16px;border:1px solid var(--border)}
.summary-item:hover{border-color:var(--border2)}
.summary-item.gaji-box{grid-column:span 2;background:linear-gradient(135deg,rgba(200,149,108,.08),transparent);border-color:var(--gold-border)}
.summary-item.gaji-box .s-val{font-size:26px;color:var(--gold)}
.summary-item.kas-box{grid-column:span 2;background:var(--green-bg);border-color:var(--green-border)}
.summary-item.kas-box .s-val{font-size:22px;color:var(--green)}
.summary-item.outbox{background:var(--red-bg);border-color:var(--red-border)}
.summary-item.outbox .s-val{color:var(--red)}
.s-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.s-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--text)}

/* DAY TOTAL */
.day-total{margin-top:12px;padding:14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text2);line-height:1.9}
.day-total strong{color:var(--gold);font-weight:600}

/* PAYDAY */
.payday-banner{padding:18px 20px;border-radius:14px;margin-bottom:16px;position:relative;overflow:hidden}
.payday-banner.today{background:var(--green-bg);border:1px solid var(--green-border)}
.payday-banner.upcoming{background:var(--gold-bg);border:1px solid var(--gold-border)}
.payday-title{font-size:14px;font-weight:700;margin-bottom:4px}
.payday-banner.today .payday-title,.payday-banner.today .payday-amount{color:var(--green)}
.payday-banner.upcoming .payday-title,.payday-banner.upcoming .payday-amount{color:var(--gold)}
.payday-detail{font-size:11.5px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.payday-amount{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:6px}

/* SYNC STATUS */
.sync-status{text-align:center;font-size:12px;font-family:'JetBrains Mono',monospace;padding:8px;margin-top:8px;border-radius:10px}
.sync-status.syncing{color:var(--gold);background:var(--gold-bg)}
.sync-status.success{color:var(--green);background:var(--green-bg)}
.sync-status.error{color:var(--red);background:var(--red-bg)}

/* HISTORY */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;animation:fadeIn .3s ease both}
.history-item:hover{border-color:var(--border3);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.history-item-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.history-date{font-size:13px;font-weight:600}
.history-gaji{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--gold)}
.history-pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:3px 10px;border-radius:20px;background:var(--surface2);color:var(--text2);font-family:'JetBrains Mono',monospace;font-weight:400;border:1px solid var(--border)}
.history-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);animation:fadeIn .2s ease}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;font-family:'JetBrains Mono',monospace}
.detail-row.total{font-weight:700;color:var(--gold);border-top:1px solid var(--border2);margin-top:6px;padding-top:10px}

/* GAJIAN */
.gajian-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden;animation:fadeIn .35s ease both}
.gajian-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.gajian-card.active-period{border-color:var(--gold-border)}
.gajian-card.active-period::after{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.gajian-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.gajian-period-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.gajian-period-dates{font-size:11.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:3px}
.gajian-total-box{text-align:right;flex-shrink:0}
.gajian-total-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.gajian-total-value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--gold)}
.gajian-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.gajian-stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.g-stat{background:var(--surface2);border-radius:10px;padding:10px 12px;border:1px solid var(--border)}
.g-stat-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.g-stat-value{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;margin-top:4px}
.gajian-day-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.gajian-day-row:last-child{border-bottom:none}
.gajian-day-date{color:var(--text2)}
.gajian-day-date .day-name{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-left:4px}
.gajian-day-amount{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--gold)}
.gajian-day-row.empty .gajian-day-amount{color:var(--text3);font-weight:400}
.gajian-status-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.02em;margin-top:4px}
.gajian-status-badge.paid{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.gajian-status-badge.pending{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.gajian-status-badge.future{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--gold);color:#0c0a08;font-family:inherit;font-size:13px;font-weight:700;padding:11px 24px;border-radius:99px;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(200,149,108,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:56px 20px;color:var(--text3);font-size:14px}
.empty-icon{font-size:44px;margin-bottom:14px;opacity:.6}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(12,10,8,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);padding:6px 12px env(safe-area-inset-bottom,6px);z-index:100}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mobile-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text3);font-family:inherit;font-size:10px;font-weight:600;padding:8px 20px;cursor:pointer;border-radius:12px;transition:all .2s}
.mobile-nav-btn.active{color:var(--gold);background:var(--gold-bg)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(8px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:28px;width:480px;max-width:95vw;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}

input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7) sepia(.3) hue-rotate(350deg);opacity:.5;cursor:pointer}
input[type="number"]{-moz-appearance:textfield}

@media(max-width:900px){
  .sidebar{display:none}
  .mobile-nav{display:block}
  .content{max-height:calc(100vh - 67px - 58px);padding:20px 16px 88px}
}
@media(max-width:600px){
  .header{padding:10px 16px}
  .content{padding:16px 12px 88px}
  .summary-grid{grid-template-columns:1fr}
  .summary-item.gaji-box,.summary-item.kas-box{grid-column:span 1}
  .gajian-stats,.gajian-stats2{grid-template-columns:1fr}
  .page-title{font-size:24px}
  .card{padding:18px}
}
  </style>
</head>

  <div id="root"></div>
  <div class="toast" id="toast"></div>

    const { useState, useMemo, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBlWMc-CLMMFC0ULA38w-XtzLcuSG4ZdGQ",

    const PRODUCTS = [
      { id:'vietnam', name:'Kopi Vietnam Drip', price:8000, gaji:1500, emoji:'☕' },

                          {oe.length>0&&(<div style={{borderBottom:"1px dashed var(--border2)",marginBottom:6,paddingBottom:6}}><div style={{fontSize:9.5,fontWeight:700,color:"var(--orange)",letterSpacing:".08em",textTransform:"uppercase",padding:"2px 0 6px"}}>⬆ Limpahan {ML[p.prevMonth]}</div>
                            {p.overflowDays.map(d=>{const dd=String(d).padStart(2,'0'),ds=p.prevYear+'-'+String(p.prevMonth+1).padStart(2,'0')+'-'+dd,en=entries[ds],dt2=new Date(ds+'T00:00:00'),dn=DAYS[dt2.getDay()];
                              if(en){const it=PRODUCTS.filter(pr=>(en.quantities?.[pr.id]||0)>0).map(pr=>pr.name.split(' ').slice(-1)[0]+' ×'+en.quantities[pr.id]).join(', '),de=en.totalPengeluaran||0;return(<div key={ds} className="gajian-day-row" style={{background:"rgba(212,150,74,.03)"}}><div className="gajian-day-date">{d} {MO[p.prevMonth]}<span className="day-name">{dn}</span><div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono',monospace"}}>{it}{de>0&&<span style={{color:"var(--red)"}}> −{IDR(de)}</span>}</div></div><div className="gajian-day-amount">{IDR(en.gaji)}</div></div>)}
                              return(<div key={ds} className="gajian-day-row empty"><div className="gajian-day-date">{d} {MO[p.prevMonth]}<span className="day-name">{dn}</span></div><div className="gajian-day-amount">–</div></div>)})}
                          </div>)}
                          {Array.from({length:p.endDay-p.startDay+1},(_,i)=>p.startDay+i).map(d=>{const dd=String(d).padStart(2,'0'),ds=year+'-'+String(month+1).padStart(2,'0')+'-'+dd,en=entries[ds],dt2=new Date(ds+'T00:00:00'),dn=DAYS[dt2.getDay()];
                            if(en){const it=PRODUCTS.filter(pr=>(en.quantities?.[pr.id]||0)>0).map(pr=>pr.name.split(' ').slice(-1)[0]+' ×'+en.quantities[pr.id]).join(', '),de=en.totalPengeluaran||0;return(<div key={ds} className="gajian-day-row"><div className="gajian-day-date">{d} {MO[month]}<span className="day-name">{dn}</span><div style={{fontSize:10,color:"var(--text3)",fontFamily:"'JetBrains Mono',monospace"}}>{it}{de>0&&<span style={{color:"var(--red)"}}> −{IDR(de)}</span>}</div></div><div className="gajian-day-amount">{IDR(en.gaji)}</div></div>)}
                            return(<div key={ds} className="gajian-day-row empty"><div className="gajian-day-date">{d} {MO[month]}<span className="day-name">{dn}</span></div><div className="gajian-day-amount">–</div></div>)})}
                        </div>);
                    });
                  });
                })()}
              </>}

              {/* RIWAYAT */}
              {page==="riwayat"&&<>
                <div className="page-header"><h1 className="page-title">Riwayat</h1><p className="page-sub">Data penjualan yang sudah tersimpan</p></div>
                {sortedEntries.length===0?(<div className="empty"><div className="empty-icon">📋</div>Belum ada data.<br/>Mulai input di tab Input Harian.</div>)
                :sortedEntries.map((e,i)=>{
                  const sold=PRODUCTS.filter(p=>(e.quantities?.[p.id]||0)>0),tExp=e.totalPengeluaran||0,sKas=e.sisaKas!=null?e.sisaKas:(e.totalPenjualan-e.gaji-tExp),isO=openDetail===i;
                  return(<div key={e.date} className="history-item" onClick={()=>setOpenDetail(isO?null:i)}>
                    <div className="history-item-header"><span className="history-date">{fmtDate(e.date)}</span><span className="history-gaji">{IDR(sKas)}</span></div>
                    <div className="history-pills">{sold.length>0?sold.map(p=><span key={p.id} className="pill">{p.emoji} {p.name} ×{e.quantities[p.id]}</span>):<span className="pill" style={{color:"var(--text3)"}}>–</span>}{tExp>0&&<span className="pill" style={{background:"var(--red-bg)",color:"var(--red)",borderColor:"var(--red-border)"}}>-{IDR(tExp)}</span>}</div>
                    {isO&&(<div className="history-detail">
                      <div style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--gold)",margin:"0 0 6px"}}>Penjualan & Gaji</div>
                      {sold.length>0?sold.map(p=>(<div key={p.id} className="detail-row"><span>{p.emoji} {p.name} ×{e.quantities[p.id]}</span><span>{IDR(e.quantities[p.id]*p.gaji)}</span></div>)):<div className="detail-row"><span style={{color:"var(--text3)"}}>Tidak ada</span></div>}
                      <div className="detail-row total"><span>Total Gaji</span><span>{IDR(e.gaji)}</span></div>
                      {((e.expenses||[]).length>0||tExp>0)&&<><div style={{fontSize:10,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--red)",margin:"12px 0 6px"}}>Pengeluaran</div>{(e.expenses||[]).map((x,xi)=>(<div key={xi} className="detail-row"><span>{x.desc||'Pengeluaran'}</span><span style={{color:"var(--red)"}}>{IDR(x.amount)}</span></div>))}<div className="detail-row" style={{fontWeight:700}}><span>Total</span><span style={{color:"var(--red)"}}>{IDR(tExp)}</span></div></>}
                      <div className="detail-row" style={{color:"var(--green)",fontWeight:700,borderTop:"2px solid var(--border2)",marginTop:8,paddingTop:10,fontSize:14}}><span>Sisa Kas</span><span>{IDR(sKas)}</span></div>
                      <button className="btn btn-danger" style={{width:"100%",marginTop:12,padding:"9px"}} onClick={ev=>{ev.stopPropagation();deleteEntry(e.date)}}><Icon type="trash" size={13}/> Hapus</button>
                    </div>)}
                  </div>);
                })}
              </>}
            </div>
          </div>

          <div className="mobile-nav"><div className="mobile-nav-inner">
            <button className={"mobile-nav-btn "+(page==="input"?"active":"")} onClick={()=>setPage("input")}><Icon type="coffee" size={19}/> Input</button>
            <button className={"mobile-nav-btn "+(page==="gajian"?"active":"")} onClick={()=>setPage("gajian")}><Icon type="dollar" size={19}/> Gajian</button>
            <button className={"mobile-nav-btn "+(page==="riwayat"?"active":"")} onClick={()=>setPage("riwayat")}><Icon type="clock" size={19}/> Riwayat</button>
          </div></div>
        </div>);
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
