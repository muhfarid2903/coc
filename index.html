<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>COC — Clash of Champions Matematika</title>
<meta name="description" content="Arena turnamen matematika: duel cepat, bracket 8 besar, papan peringkat, dan misi harian."/>
<meta name="theme-color" content="#070a18"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23070a18'/><text x='16' y='23' text-anchor='middle' font-size='18'>🏆</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="beam beam-l"></span>
  <span class="beam beam-r"></span>
</div>

<div id="app" class="app">

  <header id="topbar" class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="Beranda">
      <span class="brand-mark">🏆</span>
      <span class="brand-text"><b>COC</b><small>Clash of Champions</small></span>
    </button>
    <div class="wallet">
      <span class="chip chip-coin" title="Koin"><i>🪙</i><b id="hudCoin">0</b></span>
      <span class="chip chip-gem" title="Permata"><i>💎</i><b id="hudGem">0</b></span>
    </div>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav id="tabbar" class="tabbar" aria-label="Navigasi utama">
    <button class="tab" data-tab="home"  type="button"><i>🏟️</i><span>Arena</span></button>
    <button class="tab" data-tab="rank"  type="button"><i>📊</i><span>Peringkat</span></button>
    <button class="tab" data-tab="quest" type="button"><i>🎯</i><span>Misi</span></button>
    <button class="tab" data-tab="me"    type="button"><i>🧑‍🚀</i><span>Profil</span></button>
  </nav>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/fx.js"></script>
<script src="js/net.js"></script>
<script src="js/live.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
